app = "openhighway"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # The vehicle watcher runs in the background of this same Machine (see
  # fly-start.sh) - it must never be auto-stopped for lack of HTTP traffic.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Fly volumes attach to exactly one Machine - this is where the SQLite
# database, camera image cache and geocode caches live.
[[mounts]]
  source = "openhighway_data"
  destination = "/app/src/config"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
