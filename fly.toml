# fly.toml app configuration file generated for openhighway on 2026-09-18T17:48:23+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openhighway'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  PORT = '8080'

[[mounts]]
  source = 'openhighway_data'
  destination = '/app/src/config'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
