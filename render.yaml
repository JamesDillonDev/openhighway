services:
  # Flask API + vehicle watcher, combined into one service (see
  # render-start.sh) so they can share the one persistent disk Render
  # allows per service - unlike docker-compose's two services on one
  # shared Docker volume.
  - type: web
    name: openhighway-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: bash render-start.sh
    plan: 0.5c-512mb # cheapest paid plan - disks/always-on aren't available on "free"
    healthCheckPath: /api/cameras
    envVars:
      - key: CORS_ORIGIN
        value: https://openhighway-frontend.onrender.com
      - key: TFL_APP_KEY
        sync: false
      - key: TRAFFIC_SCOTLAND_FTP_USER
        sync: false
      - key: TRAFFIC_SCOTLAND_FTP_PASSWORD
        sync: false
    disk:
      name: openhighway-data
      mountPath: /app/src/config
      sizeGB: 1

  # Static Vite build - served free over Render's CDN. The rewrite below
  # proxies /api/* to the backend service so the browser never needs its
  # own CORS setup or to know the backend's URL.
  - type: web
    name: openhighway-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://openhighway-api.onrender.com/api/*
